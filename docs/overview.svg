<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">日日·ToDo 使用说明</title>
  <desc id="desc">新增父任务并设置截止日期，拆分继承期限的子任务。整个任务树全部完成后进入 Done，搁置按日期保留，逾期红色提示。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 7 4.5 1 8" fill="none" stroke="#73916c" stroke-width="1.6"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;fill:#33483b}
      .muted{fill:#7d8c7d}.small{font-size:15px}.body{font-size:18px}.label{font-size:14px;letter-spacing:1px;font-weight:600}.title{font-size:34px;font-weight:700}.step{font-size:20px;font-weight:600}
      .box{fill:white;stroke:#d9e2d5;stroke-width:1.5}.check{fill:white;stroke:#9dad96;stroke-width:1.5}.tick{fill:none;stroke:white;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1120" height="720" rx="24" fill="#f5f7f2"/>
  <text x="48" y="65" class="title">日日·ToDo</text>
  <text x="48" y="99" class="body muted">把事情拆小，把完成留下。</text>
  <rect x="862" y="40" width="210" height="38" rx="19" fill="#e8eee2"/>
  <text x="967" y="65" text-anchor="middle" class="small">本地保存 · 离线使用</text>

  <rect x="48" y="130" width="1024" height="73" rx="13" class="box"/>
  <text x="70" y="174" class="body">① 写下主任务</text>
  <text x="295" y="174" class="small muted">② 设置 DDL / 长期</text>
  <text x="580" y="174" class="small muted">③ 点击 + 拆分子任务</text>
  <rect x="896" y="149" width="152" height="36" rx="8" fill="#65805c"/>
  <text x="972" y="173" text-anchor="middle" class="small" style="fill:white">添加 Todo</text>

  <text x="48" y="247" class="label">今天 / 全部待办</text>
  <text x="704" y="247" class="label">按日期 / DONE</text>
  <rect x="48" y="265" width="480" height="205" rx="14" class="box"/>
  <rect x="72" y="289" width="20" height="20" rx="5" class="check"/>
  <text x="106" y="306" class="step">准备周末出游</text>
  <rect x="387" y="283" width="119" height="31" rx="7" fill="#edf2e7"/>
  <text x="446" y="304" text-anchor="middle" class="small">DDL · 周五</text>
  <path d="M82 322V423 M82 350Q82 358 91 358H110 M82 401Q82 409 91 409H110" fill="none" stroke="#cad8c2" stroke-width="1.5"/>
  <rect x="116" y="347" width="20" height="20" rx="5" fill="#718d65"/>
  <path d="m121 357 4 4 7-8" class="tick"/>
  <text x="150" y="364" class="body muted" text-decoration="line-through">确定目的地</text>
  <rect x="116" y="398" width="20" height="20" rx="5" class="check"/>
  <text x="150" y="415" class="body">整理行李清单</text>
  <text x="106" y="450" class="small muted">子任务继承父任务 DDL，无需重复设置</text>

  <path d="M551 351H676" fill="none" stroke="#73916c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="614" y="316" text-anchor="middle" class="small">整组全部完成</text>
  <text x="614" y="386" text-anchor="middle" class="small muted">一起归档 →</text>

  <rect x="704" y="265" width="368" height="205" rx="14" class="box"/>
  <text x="728" y="297" class="small muted">按整组最后完成日期排列</text>
  <rect x="728" y="321" width="20" height="20" rx="5" fill="#718d65"/>
  <path d="m733 331 4 4 7-8" class="tick"/>
  <text x="762" y="338" class="step">准备周末出游</text>
  <text x="762" y="378" class="body muted">✓ 确定目的地</text>
  <text x="762" y="415" class="body muted">✓ 整理行李清单</text>
  <text x="728" y="450" class="small muted">部分完成时，子任务仍留在原树中</text>

  <rect x="48" y="495" width="320" height="109" rx="13" fill="#fff0e9"/>
  <text x="70" y="530" class="step" style="fill:#a76149">逾期：红色提示</text>
  <text x="70" y="559" class="small muted">跨天继续保留，不自动延长 DDL。</text>
  <text x="70" y="584" class="small muted">点「延期 +1天」调整截止日期。</text>
  <rect x="384" y="495" width="328" height="109" rx="13" fill="#f0eaf5"/>
  <text x="406" y="530" class="step" style="fill:#8c719f">搁置：留待以后</text>
  <text x="406" y="559" class="small muted">按搁置日期保留，可恢复待办。</text>
  <text x="406" y="584" class="small muted">更早月份默认折叠，点击展开。</text>
  <rect x="728" y="495" width="344" height="109" rx="13" fill="#e8eee2"/>
  <text x="750" y="530" class="step">备份：导出后自行保管</text>
  <text x="750" y="559" class="small muted">数据保存在当前浏览器。</text>
  <text x="750" y="584" class="small muted">导入合并记录，同 ID 冲突保留本地。</text>

  <path d="M48 633H1072" stroke="#dfe6d9"/>
  <text x="48" y="668" class="small muted">点击文字编辑 · 拖动整组排序 · 删除后 15 秒可撤销</text>
  <text x="1072" y="668" text-anchor="end" class="small muted">示例说明图 · 非个人任务数据</text>
</svg>
